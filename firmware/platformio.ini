; PlatformIO Project Configuration File
; http://docs.platformio.org/page/projectconf.html
;
; Este projeto foi enxugado: só a variante TWO_AXIS_VARIANT (dois motores,
; encoders MT6701 em modo PWM) permanece. As antigas variantes (ADC, USART,
; Nunchuk, PPM, PWM, iBus, Hovercar, Hoverboard, Transpotter, Skateboard,
; ONE_AXIS) foram removidas junto com seus drivers e blocos de config.h.
; Se algum dia precisar de single-motor, é só comentar ENCODER_X ou
; ENCODER_Y no Inc/config.h (linha ~838) — o gating do firmware desliga
; sozinho o motor correspondente.

[platformio]
include_dir = Inc
src_dir     = Src

default_envs = TWO_AXIS_VARIANT

[env:TWO_AXIS_VARIANT]
platform             = ststm32
framework            = stm32cube
board                = genericSTM32F103RC
board_build.ldscript = STM32F103RCTx_FLASH.ld
debug_tool           = stlink
upload_protocol      = stlink

; monitor via terminal externo. Se quiser via pio device monitor,
; descomente e ajuste o COM:
;monitor_port  = COM5
monitor_speed  = 115200

build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32F103xE
    -Wl,-Map,firmware.map
    -lc
    -lm
    -g -ggdb                ; symbols for firmware.elf (ST STUDIO / GDB)
    -D TWO_AXIS_VARIANT     ; selects the config.h block that stays
