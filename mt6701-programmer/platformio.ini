; PlatformIO project — MT6701 configurator/programmer
;
; Target: SparkFun Pro Micro (ATmega32U4, 5V/16 MHz variant).
; Purpose: interactively read status and burn EEPROM of an MT6701 magnetic
; encoder so the DO pin outputs PWM (or whichever mode we choose) on power-up.
;
; Why a Pro Micro instead of the STM32 already on the hoverboard board:
;   - EEPROM programming on the MT6701 requires 4.5 V <= VDD <= 5.5 V.
;   - The hoverboard board runs the sensor at 3.3 V. Feeding it 5 V there
;     would need touching the LDO. A Pro Micro at 5 V handles this directly.
;   - Native USB (ATmega32U4) gives interactive serial for confirmations
;     before a permanent burn.
;
; Wiring (compact 4-in-a-row layout on the left column):
;   Pro Micro       MT6701
;   -----------     -----------------
;   A1  (0 V)  ---> GND    (A1 is on the right column, across from D4;
;                           driven LOW in setup() as a soft-GND)
;   D2  (SDA)  ---> SDA
;   D3  (SCL)  ---> SCL
;   D4  (5 V)  ---> VDD    (driven HIGH in setup() as a soft-VDD, ONLY
;                           for read/config. See README — burn EEPROM
;                           requires temporarily moving VDD to real VCC.)
;
; Pull-ups: NONE required for bench use. Internal pull-ups (~30 kΩ) on the
; ATmega32U4 handle a short jumper cable (<30 cm) at 100 kHz. If reads look
; noisy or timeout, add 4.7 kΩ externals to 5 V.
;
; Library: i-am-engineer/MT6701-arduino — full config + EEPROM burn support.
; Reference: https://github.com/I-AM-ENGINEER/MT6701-arduino

[env:promicro16]
platform         = atmelavr
board            = sparkfun_promicro16      ; 5V / 16 MHz variant
framework        = arduino
monitor_speed    = 115200
upload_speed     = 57600
lib_deps         = i-am-engineer/MT6701-arduino
build_flags      = -DDEBUG_SERIAL_ENABLED
